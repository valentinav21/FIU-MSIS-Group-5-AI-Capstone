[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 1000
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
